<h1 class="text-3xl font-bold mb-6">Transfer Employee: {{ employeeId }}</h1>

<div *ngIf="message" class="p-4 rounded-lg shadow-md mb-6" [ngClass]="{'bg-green-100 text-green-800': message.includes('successfully'), 'bg-red-100 text-red-800': !message.includes('successfully')}">
{{ message }}
</div>

<form [formGroup]="form" (ngSubmit)="submitTransfer()" class="bg-white p-6 rounded-lg shadow-lg max-w-md mx-auto">
<div class="mb-4">
<label for="departmentId" class="block text-gray-700 font-bold mb-2">New Department</label>
<select formControlName="departmentId" id="departmentId"
class="shadow-sm border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500">
<option value="" disabled>Select a department</option>
<option *ngFor="let dept of departments" [value]="dept.id">{{ dept.name }}</option>
</select>
<div *ngIf="form.get('departmentId')?.touched && form.get('departmentId')?.invalid" class="text-red-500 text-sm mt-1">
Department is required.
</div>
</div>
<div class="flex items-center justify-end">
<button type="submit" [disabled]="submitting || form.invalid"
class="bg-blue-600 text-black font-bold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
<span *ngIf="submitting">Transferring...</span>
<span *ngIf="!submitting">Transfer Employee</span>
</button>
</div>
</form>
