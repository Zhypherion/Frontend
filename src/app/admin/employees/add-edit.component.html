<div class="card shadow-sm rounded-3">
  <div class="card-header bg-dark">
    <h3 class="mb-0">{{ title }}</h3>
  </div>

  <div class="card-body">
    <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="onSubmit()">

      <!-- Employee ID -->
      <div class="form-group">
        <label for="employeeId">Employee ID</label>
        <input 
          id="employeeId"
          name="employeeId"
          type="text" 
          formControlName="employeeId" 
          class="form-control" 
          readonly />
      </div>

      <!-- Account -->
      <div class="mb-3">
        <label for="accountId" class="form-label">Account</label>
        <select 
          id="accountId"
          name="accountId"
          formControlName="accountId" 
          class="form-select">
          <option value="">-- Select Account --</option>
          <option *ngFor="let acc of accounts" [value]="acc.id">
            {{ acc.email }}
          </option>
        </select>
        <div *ngIf="submitted && f.accountId.errors" class="invalid-feedback">
          Account is required
        </div>
      </div>

      <!-- Position -->
      <div class="mb-3">
  <label for="positionId" class="form-label">Position</label>
  <select
    id="positionId"
    name="positionId"
    formControlName="positionId"
    class="form-select"
    [ngClass]="{ 'is-invalid': submitted && f.positionId.errors }">
    <option value="">-- Select Position --</option>
    <option *ngFor="let pos of positions" [value]="pos.id">
      {{ pos.name }} ({{ pos.department?.name }})
    </option>
  </select>
  <div *ngIf="submitted && f.positionId.errors" class="invalid-feedback">
    Position is required
  </div>
</div>


      <!-- Department -->
      <div class="form-group">
        <label for="departmentId">Department</label>
        <select 
          id="departmentId"
          name="departmentId"
          formControlName="departmentId" 
          class="form-control">
          <option value="">-- Select Department --</option>
          <option *ngFor="let dept of departments" [value]="dept.id">
            {{ dept.name }}
          </option>
        </select>
      </div>

      <!-- Hire Date -->
      <div class="mb-3">
        <label for="hireDate" class="form-label">Hire Date</label>
        <input 
          id="hireDate"
          name="hireDate"
          type="date" 
          formControlName="hireDate" 
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f.hireDate.errors }" />
        <div *ngIf="submitted && f.hireDate.errors" class="invalid-feedback">
          Hire Date is required
        </div>
      </div>

      <!-- Status -->
      <div class="mb-3">
        <label for="status" class="form-label">Status</label>
        <select 
          id="status"
          name="status"
          formControlName="status" 
          class="form-select"
          [ngClass]="{ 'is-invalid': submitted && f.status.errors }">
          <option value="">Select status</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
        <div *ngIf="submitted && f.status.errors" class="invalid-feedback">
          Status is required
        </div>
      </div>

      <!-- Buttons -->
      <div class="d-flex justify-content-start">
        <button type="submit" [disabled]="submitting" class="btn btn-primary me-2">
          <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
          Save
        </button>
        <a routerLink="/admin/employees" class="btn btn-secondary">Cancel</a>
      </div>

    </form>

    <!-- Loader -->
    <div *ngIf="loading" class="text-center my-4">
      <span class="spinner-border spinner-border-lg"></span>
    </div>
  </div>
</div>
